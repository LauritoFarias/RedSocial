<router-outlet />

@if (authService.mostrarModalExpiracion()) {
  <div class="session-modal-backdrop">
    <div class="session-modal-card" role="dialog" aria-modal="true">
      <div class="session-badge">⏳ Aviso de seguridad</div>
      <h3>Tu sesión está por expirar</h3>
      <p>
        Quedan <strong>{{ authService.segundosRestantes() }} segundos</strong> de sesión activa.
        ¿Deseás extender tu sesión para seguir navegando?
      </p>

      <div class="session-modal-actions">
        <button
          type="button"
          class="btn-secondary"
          [disabled]="authService.refrescandoToken()"
          (click)="authService.logout()">
          Cerrar sesión
        </button>
        <button
          type="button"
          class="btn-primary"
          [disabled]="authService.refrescandoToken()"
          (click)="authService.extenderSesion()">
          {{ authService.refrescandoToken() ? 'Extendiendo...' : 'Sí, extender sesión' }}
        </button>
      </div>
    </div>
  </div>
}

<section class="feed-container">
  <header class="feed-controls">
    <h1>Publicaciones</h1>

    <div class="sort-selector">
      <span>Ordenar por:</span>
      <button 
        type="button"
        [class.active]="sortBy() === 'fecha'" 
        (click)="cambiarOrden('fecha')">
        Más recientes
      </button>
      <button 
        type="button"
        [class.active]="sortBy() === 'likes'" 
        (click)="cambiarOrden('likes')">
        Más Me gusta
      </button>
    </div>
  </header>

  @if (cargando()) {
    <div class="loading-state">Cargando publicaciones...</div>
  } @else {
    <div class="posts-list">
      @for (item of posts(); track item._id) {
        <app-post-card
          [post]="item"
          [currentUserId]="currentUserId()"
          (likeToggled)="manejarLike($event)"
          (deleted)="manejarEliminacion($event)"
        />
      } @empty {
        <p class="empty-state">No hay publicaciones para mostrar.</p>
      }
    </div>

    @if (totalPages() > 1) {
      <nav class="pagination">
        <button 
          type="button" 
          [disabled]="currentPage() === 1" 
          (click)="cambiarPagina(currentPage() - 1)">
          Anterior
        </button>

        <span>Página {{ currentPage() }} de {{ totalPages() }}</span>

        <button 
          type="button" 
          [disabled]="currentPage() === totalPages()" 
          (click)="cambiarPagina(currentPage() + 1)">
          Siguiente
        </button>
      </nav>
    }
  }
</section>
